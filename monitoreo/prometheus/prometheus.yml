# GENERADO por monitoreo/slo.py (laboratorio). No editar a mano.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    entorno: laboratorio
rule_files:
- /etc/prometheus/reglas/*.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
scrape_configs:
- job_name: api
  static_configs:
  - targets:
    - api:8000
    labels:
      servicio: diagnostico
- job_name: vigilante
  static_configs:
  - targets:
    - vigilante:9101
    labels:
      servicio: diagnostico
- job_name: operaciones
  static_configs:
  - targets:
    - operaciones:9102
    labels:
      servicio: diagnostico
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
    labels:
      servicio: diagnostico
- job_name: alertmanager
  static_configs:
  - targets:
    - alertmanager:9093
    labels:
      servicio: diagnostico
- job_name: loki
  static_configs:
  - targets:
    - loki:3100
    labels:
      servicio: diagnostico
