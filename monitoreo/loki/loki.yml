# Loki en un solo proceso, con almacenamiento en disco (suficiente para el laboratorio).
# Recibe los logs de la API por OTLP en /otlp/v1/logs: los atributos del log (evento, trace_id, origen...)
# quedan como metadatos estructurados y service.name como la etiqueta service_name.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 168h

analytics:
  reporting_enabled: false
