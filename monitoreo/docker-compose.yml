# Laboratorio de monitoreo: la API más las herramientas de observabilidad, alertas y respuesta automática.
#   python monitoreo/slo.py                                   generar reglas de Prometheus y Alertmanager
#   python monitoreo/tablero.py                               generar el tablero de Grafana
#   docker compose -f monitoreo/docker-compose.yml up -d --build
#
#   API y página web  http://localhost:8000        Grafana (tablero)  http://localhost:3000
#   Prometheus        http://localhost:9090        Jaeger (trazas)    http://localhost:16686
#   Alertmanager      http://localhost:9093        Operaciones        http://localhost:9102/bitacora
#   MLflow            http://localhost:5000        (registro de versiones y monitoreo del modelo)
#
# El "estado deseado" de la API (1 CPU, 1 GiB, OMP_NUM_THREADS=1) es el que operaciones restaura si alguien lo
# cambia (RB-02), igual que haría un agente de GitOps.
name: monitoreo-maiz

x-servicios: &servicios
  build: ./servicios
  image: monitoreo-maiz-servicios:0.4.1
  restart: unless-stopped
  environment: &entorno-servicios
    PROMETHEUS_URL: http://prometheus:9090
    API_URL: http://api:8000
    DIR_MODELOS: /datos/modelo
    MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  api:
    build: ..
    image: diagnostico-hoja-maiz-api:0.4.0
    container_name: diagnostico-hoja-maiz
    ports:
      - "8000:8000"
    environment:
      TOKEN_ADMIN: ${TOKEN_ADMIN:-laboratorio-maiz}
      CAOS_HABILITADO: "1"                        # solo en este laboratorio: permite simular incidentes
      ENTORNO: laboratorio
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs
    volumes:
      - ../modelo:/app/modelo:ro                  # registro de versiones: se promueve o regresa sin reconstruir
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped
    depends_on: [jaeger, loki]

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-datos:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.2
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-datos:/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.15
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"           # laboratorio: sin inicio de sesión
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/tableros/operativo.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/tableros:/var/lib/grafana/tableros:ro
      - grafana-datos:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.10
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-datos:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  jaeger:
    # 2.20.0 y no la más reciente: desde la 2.21 Jaeger quitó la API HTTP v1 (/api/services) que todavía usa el
    # conector de Jaeger de Grafana 12.4 (las trazas llegaban, pero Grafana no podía consultarlas)
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"
    restart: unless-stopped

  mlflow:
    # Model Registry y experimentos de monitoreo; base de datos y artefactos en un volumen
    image: ghcr.io/mlflow/mlflow:v3.17.1
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artefactos
      - --serve-artifacts
      - --allowed-hosts=localhost:5000,127.0.0.1:5000,mlflow:5000,localhost,mlflow
    volumes:
      - mlflow-datos:/mlflow
    ports:
      - "5000:5000"
    restart: unless-stopped

  vigilante:
    <<: *servicios
    command: ["python", "vigilante.py"]
    ports:
      - "9101:9101"                               # para que scripts/desplegar.py pueda pedir una ronda de la sonda
    environment:
      <<: *entorno-servicios
      PERIODO_DRIFT: "15"
      PERIODO_SONDA: "30"
      VENTANA_DRIFT: "5m"                         # 1 h en producción (escala 1/12 del laboratorio)
      MUESTRAS_MIN: "50"
      F1_MIN: "0.60"
      FNR_MAX: "0.15"
      DIR_FOTOS: /datos/fotos
    volumes:
      - ../modelo:/datos/modelo:ro
      - ./datos_locales:/datos/fotos:ro

  operaciones:
    <<: *servicios
    command: ["python", "operaciones.py"]
    environment:
      <<: *entorno-servicios
      TOKEN_ADMIN: ${TOKEN_ADMIN:-laboratorio-maiz}
      CONTENEDOR_API: diagnostico-hoja-maiz
      CPUS_DESEADAS: "1.0"
      MEMORIA_DESEADA: "1073741824"
      VIGILANTE_URL: http://vigilante:9101
      LOKI_URL: http://loki:3100
      DIR_BITACORA: /datos/bitacora
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../modelo:/datos/modelo
      - ./bitacora:/datos/bitacora
    ports:
      - "9102:9102"

volumes:
  prometheus-datos:
  alertmanager-datos:
  grafana-datos:
  loki-datos:
  mlflow-datos:
